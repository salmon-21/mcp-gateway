# Example mcp-gateway configuration. See README for field-by-field reference.

listen: ":9000"
read_header_timeout: 10s
shutdown_timeout: 30s

# External base URL the gateway is reachable at (used for OIDC issuer rewriting
# and oauth-protected-resource metadata).
external_url: "https://example.tail-scale.ts.net"

dex:
  # Public Dex URL the user agent is redirected to during /authorize.
  public_url: "https://example.tail-scale.ts.net"
  # Internal Dex HTTP URL the gateway uses for JWKS / discovery.
  internal_url: "http://dex:5556"
  # Dex gRPC endpoint for Dynamic Client Registration.
  grpc_url: "dex:5557"

jwt:
  # Optional: only accept tokens whose aud is in this list. Empty means
  # accept any token signed by the trusted issuer — the right default for a
  # DCR-fronted Dex, where every dynamically-registered client gets its own
  # client_id as aud and no fixed value can be pinned in advance.
  audience: []
  clock_skew: 30s

backends:
  - name: toggl
    prefix: "/mcp/toggl"
    upstream: "http://toggl-mcp:8099/mcp"
    timeout: 60s
    sse: true

  - name: todo
    prefix: "/mcp/todo"
    upstream: "http://ms365-mcp:3001/mcp"
    timeout: 60s
    sse: true

  - name: hcgateway
    prefix: "/mcp/hcgateway"
    upstream: "http://hcgateway-mcp:8100/mcp"
    timeout: 60s
    sse: true

log:
  level: "info"
  format: "json"
